# Ray Tracer Configuration File
# Edit these values and re-run without recompiling (except USE_DOUBLE_PRECISION)

# Rendering settings
PROGRESSIVE_RENDER=false    # Frame capture for GIF (true/false)
SAMPLES_PER_PIXEL=100       # Number of samples per pixel
IMAGE_WIDTH=600             # Image width in pixels
IMAGE_HEIGHT=600            # Image height in pixels

# CUDA optimization settings
BLOCK_SIZE_X=32             # Thread block X dimension
BLOCK_SIZE_Y=8              # Thread block Y dimension
NUM_STREAMS=4               # Number of CUDA streams for parallel execution

# Memory settings
USE_PINNED_MEMORY=true      # Use pinned host memory for faster transfers (true/false)
USE_CONSTANT_MEMORY=true    # Use constant memory for camera data (true/false)

# Acceleration settings
BVH_OPTIM=false             # Use BVH acceleration structure (true/false)

# Load balancing
USE_PERSISTENT_THREADS=false # Use persistent threads per-pixel (true/false)
USE_TILED_PERSISTENT=false   # Use tiled persistent threads (true/false) - better cache locality
TILE_SIZE=16                 # Tile size for tiled persistent (e.g., 8, 16, 32). Threads = TILE_SIZE^2
NUM_BLOCKS=256               # Number of blocks for persistent/tiled kernels (saturate GPU)

# NOTE: USE_DOUBLE_PRECISION must be set at compile time in main.cu
# It cannot be changed at runtime because it affects the type system
